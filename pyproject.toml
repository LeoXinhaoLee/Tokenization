[project]
name = "Tokenization"
version = "0.1.0"
description = "Tokenizing datasets"
readme = "README.md"
requires-python = ">=3.10, <=3.11"
dependencies = [
  "pytest==8.3.2",
  "python-dotenv==1.0.1",
  "pytorch-lightning==2.4.0",
  "torch==2.1.1",
  "transformers==4.44.1",
  "datasets==2.18.0",
  "tokenizers==0.19.1",
  "numpy==1.26.4",
  "huggingface_hub==0.24.6",
  "tqdm==4.66.5",
  "multiprocess==0.70.16",
  "pyarrow==17.0.0",
  "pyarrow-hotfix==0.6",
  "pandas==2.2.2",
  "zstandard",
  "ray",
  "h5py",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "I", "ARG"]
ignore = [
  "E731",  # Do not assign a lambda expression, use a def
  "F722",  # Errors for jaxtyping syntax
  "E722",  # Do not use bare 'except'
]
